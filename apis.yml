name: NanoVMs
description: NanoVMs builds unikernel infrastructure that lets developers run a single
  application as its own lightweight, secure virtual machine with no operating system
  and no devops. Its open-source toolchain centers on OPS (the ops CLI, ops.city) for
  building and deploying unikernels to any cloud in seconds, and Nanos (nanos.org), a
  kernel designed to run one and only one application in a virtualized environment.
  The project ships editor extensions, a Terraform provider, a Homebrew tap, a package
  repository (repo.ops.city), and an official MCP server (ops-mcp) for driving the
  toolchain from AI agents. NanoVMs is a Bloomberg Beta and Initialized Capital
  portfolio company.
